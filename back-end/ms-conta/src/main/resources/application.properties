spring.application.name=ms-conta

# =========================
# WRITE DATABASE
# =========================
spring.datasource.write.url=${SPRING_DATASOURCE_WRITE_URL:jdbc:postgresql://localhost:5432/bantads}
spring.datasource.write.username=${SPRING_DATASOURCE_WRITE_USERNAME:postgres}
spring.datasource.write.password=${SPRING_DATASOURCE_WRITE_PASSWORD:postgres}
spring.datasource.write.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=conta_write

# =========================
# READ DATABASE
# =========================
spring.datasource.read.url=${SPRING_DATASOURCE_READ_URL:jdbc:postgresql://localhost:5432/bantads}
spring.datasource.read.username=${SPRING_DATASOURCE_READ_USERNAME:postgres}
spring.datasource.read.password=${SPRING_DATASOURCE_READ_PASSWORD:postgres}
spring.datasource.read.driver-class-name=org.postgresql.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# =========================
# RABBITMQ
# =========================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

server.port=8080

cliente.service.url=${CLIENTE_SERVICE:http://ms_cliente:8080}
