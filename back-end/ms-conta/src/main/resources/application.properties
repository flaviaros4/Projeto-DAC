# =========================
# WRITE DATABASE
# =========================

spring.datasource.write.jdbc-url=jdbc:postgresql://localhost:5432/conta_write
spring.datasource.write.username=postgres
spring.datasource.write.password=root
spring.datasource.write.driver-class-name=org.postgresql.Driver

# =========================
# READ DATABASE
# =========================

spring.datasource.read.jdbc-url=jdbc:postgresql://localhost:5432/conta_read
spring.datasource.read.username=postgres
spring.datasource.read.password=root
spring.datasource.read.driver-class-name=org.postgresql.Driver

# =========================
# JPA
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# RABBITMQ
# =========================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest