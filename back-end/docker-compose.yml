services:
  mongo_db:
    image: mongo:latest
    container_name: mongo_auth
    hostname: mongoauth
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:15-alpine
    container_name: postgres_bantads
    hostname: postgres
    environment:
      POSTGRES_DB: bantads
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  ms_auth:
    build:
      context: ./ms_auth
      dockerfile: Dockerfile
    container_name: ms_auth
    hostname: msauth
    ports:
      - "8081:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongoauth:27017/auth_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      - mongo_db
      - rabbitmq

  ms_cliente:
    build:
      context: ./ms-cliente
      dockerfile: Dockerfile
    container_name: ms_cliente
    hostname: mscliente
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bantads
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      - postgres
      - rabbitmq

  ms_conta:
    build:
      context: ./ms-conta
      dockerfile: Dockerfile
    container_name: ms_conta
    hostname: msconta
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_WRITE_URL: jdbc:postgresql://postgres:5432/bantads
      SPRING_DATASOURCE_WRITE_USERNAME: postgres
      SPRING_DATASOURCE_WRITE_PASSWORD: postgres
      SPRING_DATASOURCE_READ_URL: jdbc:postgresql://postgres:5432/bantads
      SPRING_DATASOURCE_READ_USERNAME: postgres
      SPRING_DATASOURCE_READ_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      - postgres
      - rabbitmq

  ms_gerente:
    build:
      context: ./ms-gerente
      dockerfile: Dockerfile
    container_name: ms_gerente
    hostname: msgerente
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bantads
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      - postgres
      - rabbitmq

  api_gateway:
    build:
      context: ./api-gateway
    hostname: apigateway
    ports:
      - "3000:3000"
    environment:
      AUTH_SERVICE: http://msauth:8080
      CLIENTE_SERVICE: http://mscliente:8080
      CONTA_SERVICE: http://msconta:8080
      GERENTE_SERVICE: http://msgerente:8080
      JWT_SECRET: minha-chave-secreta-segura-para-assinar-tokens-jwt-bantads
    depends_on:
      - ms_auth
      - ms_cliente
      - ms_conta
      - ms_gerente

volumes:
  mongo_data:
  postgres_data:
