<div class="content">
  <aside class="barra-nav">
    <div class="logo-barra-nav">
      <mat-icon fontIcon="person"></mat-icon>
      <div *ngIf="cliente">
  <h1>Olá, {{ cliente.nome.split(' ')[0] }}</h1>
</div>
    </div>

    <div class="menu">
      <button mat-button class="active">
        <mat-icon>home</mat-icon>
        Home
      </button>
      <button mat-button (click)="abrirModal('perfil')">
        <mat-icon>account_circle</mat-icon>
        Meu Perfil
      </button>
      <button mat-button (click)="logout()">
        <mat-icon>logout</mat-icon>
        Sair
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="card-saldo">
  <div class="info-conta">
    <span class="label">Saldo disponível</span>
    <h2 [ngClass]="{ 'negativo': (conta?.saldo ?? 0) < 0 }">
    {{ conta?.saldo | currency:'BRL' }}
    </h2>
  </div>
</div>

<div class="secao-acoes">
  <div class="grid-funcionalidades">
    
    <div class="card-acao" (click)="abrirModal('deposito')">
      <mat-icon>payments</mat-icon>
      <span>Depósito</span>
    </div>

    <div class="card-acao" (click)="abrirModal('saque')">
      <mat-icon>money_off</mat-icon>
      <span>Saque</span>
    </div>

    <div class="card-acao" (click)="abrirModal('transferencia')">
      <mat-icon>sync_alt</mat-icon>
      <span>Transferir</span>
    </div>

    <div class="card-acao" (click)="abrirModal('extrato')">
      <mat-icon>receipt_long</mat-icon>
      <span>Extrato</span>
    </div>
  </div>
</div>
