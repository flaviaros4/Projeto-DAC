

<div id="espaco"></div>
<div id="container">
    <div id="logo">
        <img src="assets/images/undraw_enter_nwx3.png" alt="">
       
        <p>Faça login na <span>BANTADS</span> digitando seu E-mail e senha!</p>
    </div>
    <div id="bloco">
        <h1>LOGIN</h1>
        <form (submit)="logar();">
            <div class="campo">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" [(ngModel)]="usuario.email" placeholder="usuario@bantads.com.br">
            </div>
    
            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha" [(ngModel)]="usuario.senha" placeholder="******">
            </div>
    
            <input type="submit" value="Logar" id="botao">
            <p class="cadastro-link">Não tem uma conta? <a href="/autocadastro">Cadastre-se</a></p>
        </form>
    </div>
</div>
