<mat-sidenav-container class="content">
  <mat-sidenav mode="side" opened class="barra-nav">
    <div class="logo-barra-nav">
     <mat-icon>person</mat-icon>
    </div>

    <div class="menu">
      <button>Consultar Todos os Clientes</button>
      <button>Buscar Cliente</button>
      <button>3 Melhores Clientes</button>
    </div>
  </mat-sidenav>

        <mat-sidenav-content>



          <main class="main-content">
            <h1>Solicitações Pendentes</h1>

            <div class="tabela">
              <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
                <ng-container matColumnDef="cpf">
                  <th mat-header-cell *matHeaderCellDef>CPF</th>
                  <td mat-cell *matCellDef="let cliente ">{{ cliente.cpf }}</td>
                </ng-container>

                <ng-container matColumnDef="nome">
                  <th mat-header-cell *matHeaderCellDef>Nome</th>
                  <td mat-cell *matCellDef="let cliente">{{ cliente.nome }}</td>
                </ng-container>

                <ng-container matColumnDef="salario">
                  <th mat-header-cell *matHeaderCellDef>Salário</th>
                  <td mat-cell *matCellDef="let cliente">{{ cliente.salario }}</td>
                </ng-container>

                <ng-container matColumnDef="acoes">
                  <th mat-header-cell *matHeaderCellDef>Ações</th>
                  <td mat-cell *matCellDef="let cliente">
                    <div class="botoes">
                      <button class="btn">Aprovar</button>
                      <button class="btn">Rejeitar</button>
                    </div>

                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let cliente; columns: displayedColumns;"></tr>
              </table>
            </div>


          </main>

          <label for="menu-alt" class="sobreposicao"></label>
        </mat-sidenav-content>
</mat-sidenav-container>
