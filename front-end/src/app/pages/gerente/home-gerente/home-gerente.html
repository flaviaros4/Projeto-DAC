<div class="content">


  <div class="main-content">
    <h1>Solicitações Pendentes</h1>

    <div class="tabela">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 ">
        <ng-container matColumnDef="cpf">
          <th mat-header-cell *matHeaderCellDef>CPF</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.cpf | mask: '000.000.000-00' }}</td>
        </ng-container>

        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.nome }}</td>
        </ng-container>

        <ng-container matColumnDef="salario">
          <th mat-header-cell *matHeaderCellDef>Salário</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.salario | currency:'BRL' }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let cliente">
            <div class="botoes">
              <button class="btn" (click)="aprovarCliente(cliente)">Aprovar</button>
              <button class="btn" (click)="rejeitarCliente(cliente)">Rejeitar</button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let cliente; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
</div>
