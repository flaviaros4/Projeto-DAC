<div class="content">
 

 

  <div class="main-content">
  
    
    <div class="head">
         <h1>Clientes</h1> 
         <input type="text" placeholder="Digite o CPF ou Nome do cliente" (input)="filtrarClientes($any($event.target).value)">
    </div>

    <div class="tabela">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 "  >
        <ng-container matColumnDef="cpf">
          <th mat-header-cell *matHeaderCellDef>CPF</th>
          <td mat-cell *matCellDef="let cliente" >{{ cliente.cpf | mask: '000.000.000-00'}}</td>
        </ng-container>

        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.nome }}</td>
        </ng-container>

        <ng-container matColumnDef="cidade">
          <th mat-header-cell *matHeaderCellDef>Cidade</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.endereco?.cidade || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.endereco?.estado || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="saldo">
          <th mat-header-cell *matHeaderCellDef>Saldo</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.saldo | currency:'BRL' }}</td>
        </ng-container>

        <ng-container matColumnDef="limite">
          <th mat-header-cell *matHeaderCellDef>Limite</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.limite | currency:'BRL' }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let cliente">
            <div class="botoes">
              <button class="btn" (click)="detalharCliente(cliente)" >Visualizar</button>

            </div>
          </td>
        </ng-container>

       

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let cliente; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
</div>
