<div class="overlay">
  <div class="modal">

    <h2>Editar Gerente</h2>

    <div>
        <form action="salvar.js" class="formulario">
            <div>
                <label for="nome">Nome: </label>
                <input type="text" name="nome" id="nome" [value]="gerente.nome">
            </div>
        
            <div>
                <div>CPF: </div>
                {{ gerente.cpf }}
            </div>
        
            <div>
                <div>Telefone: </div>
                {{ gerente.telefone }}
            </div>
        
            <div>
                <label for="email">Email</label>
                <input type="email" name="email" id="email" [value]="gerente.email">
            </div>
        
            <div>
                <label for="senha">Senha</label>
                <input type="text" name="senha" id="senha">
            </div>

             <div class="botoes">
                <button type="button" (click)="fecharModal()" class="cancelar">Cancelar</button>
                <button type="submit" class="salvar">Salvar</button>
            </div>
        </form>
    </div>
  </div>
</div>
