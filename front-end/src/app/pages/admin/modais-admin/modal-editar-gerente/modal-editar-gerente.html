<div class="overlay">
  <div class="modal">

    <h2>Editar Gerente</h2>

    <form (ngSubmit)="salvar()" class="formulario">

      <div>
        <label>Nome:</label>
        <input type="text" [(ngModel)]="nome" name="nome">
      </div>

      <div>
        <div>CPF:</div>
        {{ gerente.cpf }}
      </div>

      <div>
        <div>Telefone:</div>
        {{ gerente.telefone }}
      </div>

      <div>
        <label>Email:</label>
        <input type="email" [(ngModel)]="email" name="email">
      </div>

      <div>
        <label>Senha:</label>
        <input type="text" [(ngModel)]="senha" name="senha">
      </div>

      <div class="botoes">
        <button type="button" (click)="fecharModal()" class="cancelar">
          Cancelar
        </button>
        <button type="submit" class="salvar">
          Salvar
        </button>
      </div>

    </form>
  </div>
</div>
